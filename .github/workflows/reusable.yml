name: Reusable Deploy
on:
  workflow_call:
    inputs: # By using this key under workflow_call we can take the input in workflow, that is reuse by other workflow
      artifact-name:  # Inputs passed by the caller workflow
        description: The name of the deployable artifact Files
        required: true
        default: dist
        type: string
    outputs:
      result:
        description: The result of the deployment operation
        value: ${{ jobs.deploy.outputs.outcome }}
    # secrets:
    #   some-secret:
    #     required: false
      

jobs: 
  deploy:
    outputs:
      outcome: ${{ steps.set-result.outputs.step-result }}
    runs-on: ubuntu-latest
    steps:
      - name: Get Code 
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }} # This gets the artifact name dynamically
      - name: List Files
        run: ls
      - name: Output information
        run: echo "Deploying & uploading..."
      - name: Set result outputs
        id: set-result
        run: echo "::set-output name=step-result::success"