name: Matrix Demo 
on: push
jobs:
  build:
    strategy:
      matrix: # By using matrix we can run this job for these all values that was mentioned.
        node-version: [12, 14, 16]
        operating-system: [ubuntu-latest, windows-latest]
        include: # By using include we can run this job for only these values that was mentioned.
          - node-version: 14
            operating-system: ubuntu-latest
          - node-version: 18
            operating-system: ubuntu-latest
        exclude: # By using exclude we can exclude the job to run for this version and OS
          - node-version: 12
            operating-system: windows-latest
    runs-on: ${{ matrix.operating-system }}
    steps:
      - name: Get Code 
        uses: actions/checkout@v3
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
      - name: Install Dependencies
        run: npm install
      - name: Build Project
        run: npm run build
      - name: Run Tests
        run: npm test